name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install stem aiosqlite pysocks "requests[socks]" playwright pyinstaller
          python -m playwright install chromium

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          echo "REACT_APP_BACKEND_URL=" > .env
          yarn install --frozen-lockfile
          yarn build

      - name: Copy frontend build into backend
        shell: bash
        run: |
          rm -rf backend/static
          cp -r frontend/build backend/static

      - name: Build EXE with PyInstaller
        working-directory: backend
        run: |
          python -m PyInstaller --noconfirm --onefile --name yt_booster `
            --add-data "static;static" `
            --hidden-import "aiosqlite" `
            --hidden-import "stem" `
            --hidden-import "stem.control" `
            --hidden-import "playwright.async_api" `
            --collect-all "playwright" `
            server.py

      - name: Download Tor Expert Bundle
        shell: powershell
        run: |
          $url = "https://archive.torproject.org/tor-package-archive/torbrowser/13.5.7/tor-expert-bundle-windows-x86_64-13.5.7.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile tor.tgz
          New-Item -ItemType Directory -Force -Path tor | Out-Null
          tar -xzf tor.tgz -C tor
          if (Test-Path "tor\tor\tor.exe") {
              Move-Item tor\tor\* tor\
              Remove-Item tor\tor -Recurse -Force
          }
          @"
          SocksPort 9050
          ControlPort 9051
          CookieAuthentication 1
          DataDirectory ./data
          Log notice file ./notice.log
          ExitPolicy reject *:*
          "@ | Out-File -Encoding ASCII tor\torrc

      - name: Assemble portable release folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release\yt-views-booster | Out-Null
          Copy-Item backend\dist\yt_booster.exe release\yt-views-booster\
          Copy-Item tor release\yt-views-booster\tor -Recurse
          @"
          @echo off
          title YT Views Booster
          if not exist tor\tor.exe (
              echo Tor missing. Reinstall the release folder.
              pause & exit /b 1
          )
          tasklist /FI "IMAGENAME eq tor.exe" 2^>nul ^| find /I "tor.exe" ^>nul
          if errorlevel 1 start "" /min tor\tor.exe -f tor\torrc
          timeout /t 6 /nobreak >nul
          start "" cmd /c "timeout /t 3 /nobreak >nul && start http://localhost:8001"
          yt_booster.exe
          "@ | Out-File -Encoding ASCII release\yt-views-booster\Start.bat
          Copy-Item README.md release\yt-views-booster\ -ErrorAction SilentlyContinue

      - name: Zip release
        shell: powershell
        run: |
          Compress-Archive -Path release\yt-views-booster\* -DestinationPath yt-views-booster-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-views-booster-windows
          path: yt-views-booster-windows.zip

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: yt-views-booster-windows.zip
