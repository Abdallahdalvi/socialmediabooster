name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Python deps
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install stem aiosqlite pysocks "requests[socks]" playwright pyinstaller
          python -m playwright install chromium

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          echo "REACT_APP_BACKEND_URL=" > .env
          yarn install --network-timeout 300000
          yarn build

      - name: Copy frontend build into backend
        shell: bash
        run: |
          rm -rf backend/static
          cp -r frontend/build backend/static
          ls backend/static | head

      - name: Build EXE with PyInstaller
        working-directory: backend
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --name yt_booster `
            --add-data "static;static" `
            --hidden-import aiosqlite `
            --hidden-import stem `
            --hidden-import stem.control `
            --hidden-import playwright `
            --hidden-import playwright.async_api `
            --hidden-import websockets `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.asyncio `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.websockets.wsproto_impl `
            --collect-data playwright `
            server.py

      - name: Download Tor Expert Bundle
        shell: pwsh
        run: |
          # Fetch the latest Tor Expert Bundle version dynamically
          $tor_version = "14.0.5"
          $urls = @(
            "https://archive.torproject.org/tor-package-archive/torbrowser/$tor_version/tor-expert-bundle-windows-x86_64-$tor_version.tar.gz",
            "https://dist.torproject.org/torbrowser/$tor_version/tor-expert-bundle-windows-x86_64-$tor_version.tar.gz"
          )
          $downloaded = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Trying $u"
              Invoke-WebRequest -Uri $u -OutFile tor.tgz -TimeoutSec 120
              $downloaded = $true
              break
            } catch {
              Write-Host "Failed: $($_.Exception.Message)"
            }
          }
          if (-not $downloaded) {
            Write-Error "Could not download Tor Expert Bundle from any mirror."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path tor | Out-Null
          tar -xzf tor.tgz -C tor
          # Tor Expert Bundle 14.x extracts into tor\tor\ — flatten it
          if (Test-Path "tor\tor\tor.exe") {
            Get-ChildItem -Path "tor\tor" | Move-Item -Destination "tor\" -Force
            Remove-Item "tor\tor" -Recurse -Force
          }
          if (-not (Test-Path "tor\tor.exe")) {
            Write-Host "Files under tor\ after extraction:"
            Get-ChildItem tor -Recurse | Select-Object FullName | Format-Table -AutoSize
            Write-Error "tor.exe not found after extraction."
            exit 1
          }
          @"
          SocksPort 9050
          ControlPort 9051
          CookieAuthentication 1
          DataDirectory ./data
          Log notice file ./notice.log
          ExitPolicy reject *:*
          "@ | Out-File -Encoding ASCII tor\torrc

      - name: Assemble portable release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\yt-views-booster | Out-Null
          Copy-Item backend\dist\yt_booster.exe release\yt-views-booster\
          Copy-Item tor release\yt-views-booster\tor -Recurse
          @"
          @echo off
          title YT Views Booster
          if not exist tor\tor.exe (
              echo Tor missing. Reinstall the release folder.
              pause & exit /b 1
          )
          tasklist /FI "IMAGENAME eq tor.exe" 2^>nul ^| find /I "tor.exe" ^>nul
          if errorlevel 1 start "" /min tor\tor.exe -f tor\torrc
          timeout /t 6 /nobreak >nul
          start "" cmd /c "timeout /t 3 /nobreak >nul && start http://localhost:8001"
          yt_booster.exe
          "@ | Out-File -Encoding ASCII release\yt-views-booster\Start.bat
          if (Test-Path README.md) { Copy-Item README.md release\yt-views-booster\ }
          if (Test-Path WINDOWS_EXE.md) { Copy-Item WINDOWS_EXE.md release\yt-views-booster\ }

      - name: Zip release
        shell: pwsh
        run: |
          Compress-Archive -Path release\yt-views-booster\* -DestinationPath yt-views-booster-windows.zip -Force
          Get-Item yt-views-booster-windows.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-views-booster-windows
          path: yt-views-booster-windows.zip

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: yt-views-booster-windows.zip
